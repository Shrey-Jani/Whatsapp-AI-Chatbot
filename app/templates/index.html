<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tax Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chat">
    <header>Tax Assistant</header>
    <div id="log" class="log"></div>
    <form id="f" class="composer">
      <label class="attach" title="Upload a tax slip (T4, T5, PDF or photo)">
        📎<input id="file" type="file" accept="image/*,application/pdf" hidden>
      </label>
      <input id="m" autocomplete="off" placeholder="Type a message…">
      <button>Send</button>
    </form>
  </div>
  <script>
    const sid = "web-" + Math.random().toString(36).slice(2);
    const log = document.getElementById("log");
    function add(text, who) {
      const d = document.createElement("div");
      d.className = "msg " + who;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }
    async function send(message) {
      const r = await fetch("/api/chat", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sid, message})
      });
      add((await r.json()).reply, "bot");
    }
    async function uploadFile(file) {
      add(`📎 ${file.name}`, "me");
      const fd = new FormData();
      fd.append("session_id", sid);
      fd.append("file", file);
      const r = await fetch("/api/upload", {method: "POST", body: fd});
      add((await r.json()).reply, "bot");
    }
    document.getElementById("f").addEventListener("submit", e => {
      e.preventDefault();
      const m = document.getElementById("m");
      if (!m.value.trim()) return;
      add(m.value, "me");
      send(m.value);
      m.value = "";
    });
    document.getElementById("file").addEventListener("change", e => {
      if (e.target.files[0]) uploadFile(e.target.files[0]);
      e.target.value = "";  // allow re-uploading the same file
    });
    send("");  // kick off — server replies with the first question
  </script>
</body>
</html>
